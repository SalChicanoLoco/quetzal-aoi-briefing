<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quetzal AOI Briefing — Computed Mask Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .banner { position: absolute; top: 10px; left: 50px; z-index: 1000; background: #fff;
    padding: 8px 12px; border: 2px solid #b00; border-radius: 6px; font: 14px/1.4 system-ui, sans-serif; max-width: 420px; }
  .banner b { color: #b00; }
</style>
</head>
<body>
<div id="map"></div>
<div class="banner"><b>COMPUTED MASK</b> — computed over supplied imagery. Not measured data, not ground truth, not a prediction. The generated illustration is never shown on this map.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  fetch("../assets/nagqu-snow-mask.geojson").then(function (r) {
    if (!r.ok) throw new Error("GeoJSON fetch failed: " + r.status);
    return r.json();
  }).then(function (fc) {
    var layer = L.geoJSON(fc, {
      style: function (f) {
        return f.properties.kind === "COMPUTED MASK"
          ? { color: "#b00", weight: 2, fillColor: "#f00", fillOpacity: 0.25 }
          : { color: "#00c", weight: 2, fill: false };
      },
      pointToLayer: function (f, latlng) { return L.marker(latlng); },
      onEachFeature: function (f, l) {
        l.bindPopup("<b>" + (f.properties.kind || "") + "</b><br>" +
          Object.entries(f.properties).map(function (kv) {
            return kv[0] + ": " + kv[1];
          }).join("<br>"));
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds().pad(0.1));
  }).catch(function (e) {
    document.querySelector(".banner").textContent =
      "Could not load ../assets/nagqu-snow-mask.geojson (" + e.message +
      "). Serve this folder over HTTP (for example: python3 -m http.server) or open it from GitHub Pages — file:// fetch is blocked by browsers.";
  });
</script>
</body>
</html>
